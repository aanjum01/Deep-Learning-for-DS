  - {label: NB1_C5_lam1, class: NeuralBandit1, params: {hidden: 5, lam: 1, gamma: 0.005, d: 19}}
  - {label: NB1_C25_lam0.01, class: NeuralBandit1, params: {hidden: 25, lam: 0.01, gamma: 0.005, d: 19}}
