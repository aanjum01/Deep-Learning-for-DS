# Phase 6a rehearsal (plan phase-6a.md section 7.3): shifted run, MIND-small, shifts scaled to 50k/100k/150k. Mechanics only - nothing is tuned from it.
name: phase6a_trial
env: mind_small
seeds: [100]
shifts: [50000, 100000, 150000]
algorithms:
  # gamma 1, lambda 0.01, eta 0.02: paper-grid middle setting for the J check (phase-6a R3); J = SGD steps per training call
  - {label: NeuralUCB, class: NeuralUCB, params: {gamma: 1, lam: 0.01, eta: 0.02, J: 10, batch: 500, m: 100, d: 19}}
